esphome:
  on_boot:
    then:
      - lambda: !lambda |-
          // code/logic ref: https://github.com/m5stack/M5PM1/blob/main/src/M5PM1.cpp#L1060-L1084
          // magic numbers ref: https://github.com/m5stack/M5PM1/blob/main/src/M5PM1.h#L99-L102
          optional<uint8_t> m5pm1_id    = id(stopwatch_m5pm1).read_byte(0x00);
          optional<uint8_t> m5pm1_model = id(stopwatch_m5pm1).read_byte(0x01);
          optional<uint8_t> m5pm1_hw    = id(stopwatch_m5pm1).read_byte(0x02);
          optional<uint8_t> m5pm1_sw    = id(stopwatch_m5pm1).read_byte(0x03);
          if (!m5pm1_id || !m5pm1_model || !m5pm1_hw || !m5pm1_sw) {
            ESP_LOGE("mijofa_m5pm1", "ERROR: Failed to initialise");
            // FIXME: How to raise some sort of exception here?
          } else if (m5pm1_sw >= 'A' && m5pm1_sw <= 'Z') {  // FIXME: What is this?
              ESP_LOGI("mijofa_m5pm1", "Device: ID=0x%02X MODEL=0x%02X HW=0x%02X SW=0x%02X(%c)", std::move(*m5pm1_id), std::move(*m5pm1_model), std::move(*m5pm1_hw), std::move(*m5pm1_sw), std::move(*m5pm1_sw));
          } else {
              ESP_LOGI("mijofa_m5pm1", "Device: ID=0x%02X MODEL=0x%02X HW=0x%02X SW=0x%02X", std::move(*m5pm1_id), std::move(*m5pm1_model), std::move(*m5pm1_hw), std::move(*m5pm1_sw));
              // ESP_LOGI("mijofa_m5pm1", "Device: ID=0x%02X MODEL=0x%02X HW=0x%02X SW=0x%02X", m5pm1_id, m5pm1_model, m5pm1_hw, m5pm1_sw);
          };

          // ESPHome's read_byte(...) has type of "optional<...>" which I can't just cast to an int directly, so I have to do this std::move(...) bullshit instead
          optional<uint8_t> maybe_m5pm1_pwr_cfg = id(stopwatch_m5pm1).read_byte(0x06);
          uint8_t m5pm1_pwr_cfg = *std::move(maybe_m5pm1_pwr_cfg);  // NOTE: This was 0x17 when I started
          ESP_LOGI("mijofa_m5pm1", "Power config: 0x%02X\n  LED_EN: %s\n  BOOST_EN: %s\n  LDO: %s\n  DCDC_EN: %s\n  CHG_EN: %s",
                   m5pm1_pwr_cfg,
                   (m5pm1_pwr_cfg & (1<<4)) ? "ON" : "OFF",
                   (m5pm1_pwr_cfg & (1<<3)) ? "ON" : "OFF",
                   (m5pm1_pwr_cfg & (1<<2)) ? "ON" : "OFF",
                   (m5pm1_pwr_cfg & (1<<1)) ? "ON" : "OFF",
                   (m5pm1_pwr_cfg & (1<<0)) ? "ON" : "OFF"
          );

# M5PM1
i2c_device:
  - id: stopwatch_m5pm1
    i2c_id: stopwatch_i2c_bus
    address: 0x6E

sensor:
  - platform: template
    id: stopwatch_m5pm1_vbat_l
    name: "Battery Voltage"
    unit_of_measurement: "mV"
    accuracy_decimals: 0
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s
    lambda: !lambda |-
      uint16_t m5pm1_vbat_l;
      // FIXME: ESPHome's read_byte_16 is not compatible with ESPHome's read_byte... is this a bug upstream?
      if (id(stopwatch_m5pm1).read_byte_16(0x22, &m5pm1_vbat_l)) {
        // This swaps the endianness of the bytes from read_byte, I don't know if needing this is a bug or a feature
        return __builtin_bswap16(m5pm1_vbat_l);
      };
      return NAN;
    filters:
      - delta:  # Only send update when it changes
  # FIXME: Do some percentage math on the above...  - platform: template
  - platform: template
    id: stopwatch_m5pm1_vin_l
    name: "USB⁄DC Voltage"
    unit_of_measurement: mV
    accuracy_decimals: 0
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s
    lambda: !lambda |-
      // FIXME: ESPHome's read_byte_16 is not compatible with ESPHome's read_byte... is this a bug upstream?
      uint16_t m5pm1_vin_l;
      if (id(stopwatch_m5pm1).read_byte_16(0x24, &m5pm1_vin_l)) {
        // This swaps the endianness of the bytes from read_byte, I don't know if needing this is a bug or a feature
        return __builtin_bswap16(m5pm1_vin_l);
      }
      return NAN;
    filters:
      - delta:  # Only send update when it changes
  - platform: template
    id: stopwatch_m5pm1_5vin_l
    name: "External 5V Power Voltage"
    unit_of_measurement: mV
    accuracy_decimals: 0
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s
    lambda: !lambda |-
      // FIXME: ESPHome's read_byte_16 is not compatible with ESPHome's read_byte... is this a bug upstream?
      uint16_t m5pm1_5vinout_l;
      if (id(stopwatch_m5pm1).read_byte_16(0x26, &m5pm1_5vinout_l)) {
        // This swaps the endianness of the bytes from read_byte, I don't know if needing this is a bug or a feature
        return __builtin_bswap16(m5pm1_5vinout_l);
      }
      return NAN;
    filters:
      - delta:  # Only send update when it changes
  - platform: copy
    source_id: stopwatch_m5pm1_vbat_l
    id: stopwatch_m5pm1_vbat_l_aspercentage
    name: "Battery Percentage"
    unit_of_measurement: "%"
    state_class: measurement
    device_class: battery
    accuracy_decimals: 0
    filters:
      - lambda: !lambda |-
          // ref: https://github.com/m5stack/M5StopWatch-UserDemo/blob/main/main/hal/hal_pmic.cpp#L19-L34
          // FIXME: I copied that function as-is, does it need some cleanup?
          constexpr uint16_t _battery_mv_empty = 3300;
          constexpr uint16_t _battery_mv_full  = 4200;

          if (x <= _battery_mv_empty) {
              return 0;
          }
          if (x >= _battery_mv_full) {
              return 100;
          }

          const auto scaled =
              static_cast<uint32_t>(x - _battery_mv_empty) * 100U / (_battery_mv_full - _battery_mv_empty);
          return static_cast<uint8_t>(std::min<uint32_t>(scaled, 100U));
      - delta:  # Only send update when it changes

binary_sensor:
  - platform: template
    id: stopwatch_m5pm1_pwr_src_bat
    name: "Battery Power Active"
    device_class: power
    entity_category: DIAGNOSTIC
    lambda: !lambda |-
      uint8_t m5pm1_pwr_src = *std::move(id(stopwatch_m5pm1).read_byte(0x04));
      return m5pm1_pwr_src & (1<<2);
  - platform: template
    id: stopwatch_m5pm1_pwr_src_5vin
    name: "USB⁄DC Power Active"
    device_class: plug
    entity_category: DIAGNOSTIC
    lambda: !lambda |-
      uint8_t m5pm1_pwr_src = *std::move(id(stopwatch_m5pm1).read_byte(0x04));
      return m5pm1_pwr_src & (1<<0);
  - platform: template
    id: stopwatch_m5pm1_pwr_src_5vinout
    name: "External 5V Power Active"
    device_class: plug
    entity_category: DIAGNOSTIC
    lambda: !lambda |-
      uint8_t m5pm1_pwr_src = *std::move(id(stopwatch_m5pm1).read_byte(0x04));
      return m5pm1_pwr_src & (1<<1);

  - platform: template
    id: stopwatch_m5pm1_is_charging
    name: "Battery Charging"
    device_class: battery_charging
    lambda: !lambda |-
      // Read the GPIO Input register, pull out bit 2, check that it's 'off' because it's inverted
      uint8_t m5pm1_gpio_in = *std::move(id(stopwatch_m5pm1).read_byte(0x12));
      return (((m5pm1_gpio_in >> 2) & 0x01) == 0);  // CHG_STAT / M5PM1_GPIO_NUM_2
switch:
  - platform: template
    name: "Battery Charging Enabled"
    icon: mdi:shape-circle-plus
    entity_category: CONFIG
    disabled_by_default: True
    restore_mode: DISABLED
    lambda: !lambda |-
      uint8_t m5pm1_pwr_cfg = *std::move(id(stopwatch_m5pm1).read_byte(0x06));
      return (m5pm1_pwr_cfg & (1<<0));
    turn_on_action:
      then:
        lambda: !lambda |-
          ESP_LOGD("m5pm1_mijofa", "Turning on charging");
          uint8_t m5pm1_pwr_cfg = *std::move(id(stopwatch_m5pm1).read_byte(0x06));
          if (! (m5pm1_pwr_cfg & (1<<0)) ) {
            ESP_LOGD("m5pm1_mijofa", "Turning on battery charging");
            id(stopwatch_m5pm1).write_byte(0x06, (m5pm1_pwr_cfg | (1<<0)));
          }
    turn_off_action:
      then:
        lambda: !lambda |-
          ESP_LOGD("m5pm1_mijofa", "Turning off charging");
          uint8_t m5pm1_pwr_cfg = *std::move(id(stopwatch_m5pm1).read_byte(0x06));
          if ( m5pm1_pwr_cfg & (1<<0) ) {
            ESP_LOGD("m5pm1_mijofa", "Turning off battery charging");
            id(stopwatch_m5pm1).write_byte(0x06, (m5pm1_pwr_cfg & ~(1<<0)));
          }
  # NOTE: Each of the power inputs can be disabled/enabled... I don't wanna touch that.

light:
  - platform: binary
    id: stopwatch_m5pm1_led_en
    name: "Power LED"
    icon: mdi:power-standby
    entity_category: CONFIG
    disabled_by_default: True
    output: stopwatch_m5pm1_led_en_output
    restore_state: none
    initial_state:
      state: !lambda |-
          optional<uint8_t> maybe_m5pm1_pwr_cfg = id(stopwatch_m5pm1).read_byte(0x06);
          uint8_t m5pm1_pwr_cfg = *std::move(maybe_m5pm1_pwr_cfg);
          return m5pm1_pwr_cfg & (1<<4);

output:
  - platform: template
    id: stopwatch_m5pm1_led_en_output
    type: binary
    write_action:
      - lambda: !lambda |-
          uint8_t m5pm1_pwr_cfg = *std::move(id(stopwatch_m5pm1).read_byte(0x06));
          if ((!state) && (m5pm1_pwr_cfg & (1<<4))) {  // State is off, but LED is on
            id(stopwatch_m5pm1).write_byte(0x06, (m5pm1_pwr_cfg & ~(1<<4)));
          } else if ((state) && !(m5pm1_pwr_cfg & (1<<4))) {  // State is on, but LED is off
            id(stopwatch_m5pm1).write_byte(0x06, (m5pm1_pwr_cfg | (1<<4)));
          };
