
# https://docs.m5stack.com/en/core/StopWatch
esphome:
  # libraries:
  #   - Wire  # Required by the below, I think this is part of Arduino's standard libraries
  #   - M5Unified = https://github.com/m5stack/M5Unified@0.2.27
  #   - M5GFX = https://github.com/m5stack/M5GFX@0.2.34
  #   - M5PM1 = https://github.com/m5stack/M5PM1@1.0.7
  #   - M5IOE1 = https://github.com/m5stack/M5IOE1@1.0.9
  on_boot:
    then:
      - lambda: !lambda |-
          // code/logic ref: https://github.com/m5stack/M5PM1/blob/main/src/M5PM1.cpp#L1060-L1084
          // magic numbers ref: https://github.com/m5stack/M5PM1/blob/main/src/M5PM1.h#L99-L102
          optional<uint8_t> m5pm1_id    = id(stopwatch_m5pm1).read_byte(0x00);
          optional<uint8_t> m5pm1_model = id(stopwatch_m5pm1).read_byte(0x01);
          optional<uint8_t> m5pm1_hw    = id(stopwatch_m5pm1).read_byte(0x02);
          optional<uint8_t> m5pm1_sw    = id(stopwatch_m5pm1).read_byte(0x03);
          if (!m5pm1_id || !m5pm1_model || !m5pm1_hw || !m5pm1_sw) {
            ESP_LOGE("mijofa_m5pm1", "ERROR: Failed to initialise");
            // FIXME: How to raise some sort of exception here?
          } else if (m5pm1_sw >= 'A' && m5pm1_sw <= 'Z') {  // FIXME: What is this?
              ESP_LOGI("mijofa_m5pm1", "Device: ID=0x%02X MODEL=0x%02X HW=0x%02X SW=0x%02X(%c)", std::move(*m5pm1_id), std::move(*m5pm1_model), std::move(*m5pm1_hw), std::move(*m5pm1_sw), std::move(*m5pm1_sw));
          } else {
              ESP_LOGI("mijofa_m5pm1", "Device: ID=0x%02X MODEL=0x%02X HW=0x%02X SW=0x%02X", std::move(*m5pm1_id), std::move(*m5pm1_model), std::move(*m5pm1_hw), std::move(*m5pm1_sw));
              // ESP_LOGI("mijofa_m5pm1", "Device: ID=0x%02X MODEL=0x%02X HW=0x%02X SW=0x%02X", m5pm1_id, m5pm1_model, m5pm1_hw, m5pm1_sw);
          };

          auto m5pm1_pwr_src = id(stopwatch_m5pm1).read_byte(0x04);
          ESP_LOGI("mijofa_m5pm1", "Power source: 0x%02X", std::move(*m5pm1_pwr_src));
          auto m5pm1_wake_src = id(stopwatch_m5pm1).read_byte(0x05);
          ESP_LOGI("mijofa_m5pm1", "wake source: 0x%02X", std::move(*m5pm1_wake_src));

          // // 0x17
          // auto m5pm1_pwr_cfg = id(stopwatch_m5pm1).read_byte(0x06);
          // uint8_t m5pm1_pwr_cfg_int = std::move(*m5pm1_pwr_cfg);
          // ESP_LOGI("mijofa_m5pm1", "Power config: 0x%02X\n  LED_EN: %d\n  BOOST_EN: %d\n  LDO: %d\n  DCDC_EN: %d\n  CHG_EN: %d",
          //          m5pm1_pwr_cfg_int, m5pm1_pwr_cfg_int & (1<<4), m5pm1_pwr_cfg_int & (1<<3), m5pm1_pwr_cfg_int & (1<<2), m5pm1_pwr_cfg_int & (1<<1), m5pm1_pwr_cfg_int & (1<<0));
          // // If LED_EN is on, turn it off
          // if (m5pm1_pwr_cfg_int & (1<<4)) {
          //   id(stopwatch_m5pm1).write_byte(0x06, (m5pm1_pwr_cfg_int & ~(1<<4)));
          // };
          // m5pm1_pwr_cfg = id(stopwatch_m5pm1).read_byte(0x06);
          // m5pm1_pwr_cfg_int = std::move(*m5pm1_pwr_cfg);
          // ESP_LOGI("mijofa_m5pm1", "Power config: 0x%02X\n  LED_EN: %d\n  BOOST_EN: %d\n  LDO: %d\n  DCDC_EN: %d\n  CHG_EN: %d",
          //          m5pm1_pwr_cfg_int, m5pm1_pwr_cfg_int & (1<<4), m5pm1_pwr_cfg_int & (1<<3), m5pm1_pwr_cfg_int & (1<<2), m5pm1_pwr_cfg_int & (1<<1), m5pm1_pwr_cfg_int & (1<<0));

# M5PM1
i2c_device:
  - id: stopwatch_m5pm1
    i2c_id: stopwatch_i2c_bus
    address: 0x6E

