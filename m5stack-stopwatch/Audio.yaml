# This requires IO_Extender.yaml

# ref: https://docs.m5stack.com/en/core/StopWatch#audio
switch:
  - platform: gpio
    # This MUST be on before ES8311 setup below.
    # This is the power supply for the audio DAC & ADC,
    # without this the ES8311 chip won't respond on i2c and setup will fail.
    # AIUI, the upstream firmware leaves it off until the audio player 'app' is started,
    # at which point it powers the ES8311 on, then initialises the driver.
    # ESPHome initialises all drivers on boot.
    # FIXME: Does this need to be a switch?
    id: stopwatch_psu_audio

    # When rebooting, this pin was staying HIGH across the reboot.
    # This resulted in the es8311 never rebooting,
    # which caused it to fail to initialise properly.
    # So let's restore LOW, and turn it back on immediately
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - then:
        - switch.turn_on: stopwatch_psu_audio

    internal: True
    pin:
        m5ioe1_id: stopwatch_m5ioe1_hub
        number: 2  # PYG3
        # mode:
        #     output: true
        #     open_drain: false
  - platform: gpio
    # This just enables the speaker/amplifier.
    # No sound will play with this off, but that's ok
    id: stopwatch_speaker_enable
    pin:
        m5ioe1_id: stopwatch_m5ioe1_hub
        number: 9  # PYG10
    name: "Speaker enable"
    icon: mdi:volume-vibrate  # Not great, but good enough. Couldn't find a sensible 'circular' one
    restore_mode: ALWAYS_ON
    internal: false

audio_dac:
  - platform: es8311
    i2c_id: stopwatch_i2c_bus
    id: stopwatch_dac
    # address: 0x18
    use_microphone: True
    # sample_rate: 32000
    # bits_per_sample: 16bit
i2s_audio:
  - id: stopwatch_i2s_audio
    i2s_mclk_pin: GPIO18  # I2S_MCLK
    i2s_bclk_pin: GPIO17  # I2S_BCLK
    i2s_lrclk_pin: GPIO15  # I2S_LRCK
speaker:
  - platform: i2s_audio
    i2s_audio_id: stopwatch_i2s_audio
    audio_dac: stopwatch_dac
    id: stopwatch_speaker
    i2s_dout_pin: GPIO21  # I2S_DSDIN  # DOUT on the sticker
    dac_type: external
    channel: mono  # FIXME: Is it more efficient to say 'left'?
microphone:
  - platform: i2s_audio
    i2s_audio_id: stopwatch_i2s_audio
    id: stopwatch_mic
    i2s_din_pin: GPIO16  # I2S_ASDOUT  # DIN on the sticker
    adc_type: external
