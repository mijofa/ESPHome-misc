# https://docs.m5stack.com/en/core/StopWatch

esp32:
  # ref: https://docs.m5stack.com/en/core/StopWatch#platformio
  #          [env:m5stack-stopwatch]
  #          platform = espressif32 @ 6.12.0
  #          board = esp32s3box
  #          framework = arduino
  #          board_build.partitions = default_16MB.csv
  #          board_upload.flash_size = 16MB
  #          board_upload.maximum_size = 16777216
  #          board_build.arduino.memory_type = qio_opi
  #          monitor_speed = 115200
  #          build_flags =
  #              -DESP32S3
  #              -DBOARD_HAS_PSRAM
  #              -DCORE_DEBUG_LEVEL=5
  #              -DARDUINO_USB_CDC_ON_BOOT=1
  #              -DARDUINO_USB_MODE=1
  #          lib_deps =
  #              M5Unified = https://github.com/m5stack/M5Unified
  #              M5GFX = https://github.com/m5stack/M5GFX
  #              M5PM1 = https://github.com/m5stack/M5PM1
  #              M5IOE1 = https://github.com/m5stack/M5IOE1
  board: esp32s3box
  flash_size: 16MB
  # FIXME: Is this necessary/useful? Why do people keep specifying this?
  # framework:
  #   type: arduino

psram:
  # FIXME: Confirm this
  mode: octal
  speed: 80MHz

binary_sensor:
  # https://docs.m5stack.com/en/core/StopWatch#key
  - id: KEYA
    platform: gpio
    pin: GPIO2
    name: Yellow button
  - id: KEYB
    platform: gpio
    pin: GPIO1
    name: Blue button

# I²C bus
i2c:
  - id: stopwatch_i2c_bus
    sda: GPIO47
    scl: GPIO48
    scan: True

# IMU & RTC
# ref: https://docs.m5stack.com/en/core/StopWatch#imu--rtc
time:
  - platform: rx8130
    id: rx8130_time
    # address: 0x32
motion:
  - platform: bmi270
    i2c_id: stopwatch_i2c_bus
    id: stopwatch_motion_hub
    # address: 0x68

sensor:
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_acceleration_x
    type: acceleration_x
    name: "Accel X"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_acceleration_y
    type: acceleration_y
    name: "Accel Y"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_acceleration_z
    type: acceleration_z
    name: "Accel Z"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_angular_rate_x
    type: angular_rate_x
    name: "Angle X"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_angular_rate_y
    type: angular_rate_y
    name: "Angle Y"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_angular_rate_z
    type: angular_rate_z
    name: "Angle Z"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_gyroscope_x
    type: gyroscope_x
    name: "Gyro X"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_gyroscope_y
    type: gyroscope_y
    name: "Gyro Y"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_gyroscope_z
    type: gyroscope_z
    name: "Gyro Z"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_roll
    type: roll
    name: "Roll"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_pitch
    type: pitch
    name: "Pitch"
