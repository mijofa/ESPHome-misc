# https://docs.m5stack.com/en/core/StopWatch
esphome:
  on_boot:
    then:
      # read the RTC time once when the system boots
      - rx8130.read_time:
          id: stopwatch_time

esp32:
  # ref: https://docs.m5stack.com/en/core/StopWatch#platformio
  #          [env:m5stack-stopwatch]
  #          platform = espressif32 @ 6.12.0
  #          board = esp32s3box
  #          framework = arduino
  #          board_build.partitions = default_16MB.csv
  #          board_upload.flash_size = 16MB
  #          board_upload.maximum_size = 16777216
  #          board_build.arduino.memory_type = qio_opi
  #          monitor_speed = 115200
  #          build_flags =
  #              -DESP32S3
  #              -DBOARD_HAS_PSRAM
  #              -DCORE_DEBUG_LEVEL=5
  #              -DARDUINO_USB_CDC_ON_BOOT=1
  #              -DARDUINO_USB_MODE=1
  #          lib_deps =
  #              M5Unified = https://github.com/m5stack/M5Unified
  #              M5GFX = https://github.com/m5stack/M5GFX
  #              M5PM1 = https://github.com/m5stack/M5PM1
  #              M5IOE1 = https://github.com/m5stack/M5IOE1
  board: esp32s3box
  flash_size: 16MB
  # FIXME: Is this necessary/useful? Why do people keep specifying this?
  # framework:
  #   type: arduino

psram:
  # FIXME: Confirm this
  mode: octal
  speed: 80MHz

binary_sensor:
  # https://docs.m5stack.com/en/core/StopWatch#key
  - id: KEYA
    platform: gpio
    pin:
      number: GPIO2
      inverted: true
    name: Yellow button
  - id: KEYB
    platform: gpio
    pin:
      number: GPIO1
      inverted: true
    name: Blue button

# I²C bus
i2c:
  - id: stopwatch_i2c_bus
    sda: GPIO47
    scl: GPIO48
    scan: True

# IMU & RTC
# ref: https://docs.m5stack.com/en/core/StopWatch#imu--rtc
time:
  - platform: rx8130
    i2c_id: stopwatch_i2c_bus
    id: stopwatch_time
    # address: 0x32
motion:
  - platform: bmi270
    i2c_id: stopwatch_i2c_bus
    id: stopwatch_motion_hub
    # address: 0x68

sensor:
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_acceleration_x
    type: acceleration_x
    name: "Accel X"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_acceleration_y
    type: acceleration_y
    name: "Accel Y"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_acceleration_z
    type: acceleration_z
    name: "Accel Z"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_angular_rate_x
    type: angular_rate_x
    name: "Angle X"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_angular_rate_y
    type: angular_rate_y
    name: "Angle Y"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_angular_rate_z
    type: angular_rate_z
    name: "Angle Z"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_gyroscope_x
    type: gyroscope_x
    name: "Gyro X"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_gyroscope_y
    type: gyroscope_y
    name: "Gyro Y"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_gyroscope_z
    type: gyroscope_z
    name: "Gyro Z"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_roll
    type: roll
    name: "Roll"
  - platform: motion
    motion_id: stopwatch_motion_hub
    id: stopwatch_pitch
    type: pitch
    name: "Pitch"

# M5IOE1
# ref: https://docs.m5stack.com/en/core/StopWatch#m5ioe1
# ref: https://github.com/m5stack/esphome-yaml/blob/main/components/m5ioe1/README.md
external_components:
  - source:
      type: git
      url: https://github.com/m5stack/esphome-yaml/
      path: components/
      # FIXME: This commit somehow breaks compiling with the switch.m5ioe1 component: https://github.com/m5stack/esphome-yaml/commit/86a199ea853fbfcaa27ca64f5b67416bb70a3fbf
      ref: main
    components:
      - m5ioe1  # https://github.com/m5stack/esphome-yaml/tree/main/components/m5ioe1
      # - es8311
    refresh: 1d
m5ioe1:
  id: stopwatch_m5ioe1_hub
  reset: True
  address: 0x4F

# # Vibration motor
# FIXME: WTF can't I make this work?!?
# output:
#   - platform: m5ioe1
#     m5ioe1_id: stopwatch_m5ioe1_hub
#     id: stopwatch_vibration
#     channel: PWM_1  # PYG9 / IO9 / Pin Number 8?!?!
#     pwm_polarity: ACTIVE_HIGH
#     inverted: false
# fan:
#   - platform: speed
#     output: stopwatch_vibration
#     name: "Vibration fan"
#     id: stopwatch_vibration_fan
# switch:
#   - platform: output
#     output: stopwatch_vibration
#     name: "Vibration switch"
#     id: stopwatch_vibration_pwm_switch
switch:
  # Vibration motor
  - platform: gpio
    id: stopwatch_vibration_switch
    # FIXME: I should be able to make this work with PWM/analog outputs, but that's not been working
    name: "Vibration switch"
    restore_mode: ALWAYS_OFF
    pin:
      m5ioe1_id: stopwatch_m5ioe1_hub
      number: 8

  # Audio
  - platform: gpio
    # This MUST be on before ES8311 setup below.
    # This is the power supply for the audio DAC & ADC,
    # without this the ES8311 chip won't respond on i2c and setup will fail.
    # AIUI, the upstream firmware leaves it off until the audio player 'app' is started,
    # at which point it powers the ES8311 on, then initialises the driver.
    # ESPHome initialises all drivers on boot.
    # FIXME: Does this need to be a switch?
    id: stopwatch_psu_audio
    restore_mode: ALWAYS_ON
    internal: true
    pin:
        m5ioe1_id: stopwatch_m5ioe1_hub
        number: 2  # PYG3
        # mode:
        #     output: true
        #     open_drain: false
  - platform: gpio
    # This just enables the speaker/amplifier.
    # No sound will play with this off, but that's ok
    id: stopwatch_speaker_enable
    pin:
        m5ioe1_id: stopwatch_m5ioe1_hub
        number: 9  # PYG10
    name: "Speaker enable"
    restore_mode: ALWAYS_ON
    internal: false
# Audio
# ref: https://docs.m5stack.com/en/core/StopWatch#audio
audio_dac:
  - platform: es8311
    i2c_id: stopwatch_i2c_bus
    id: stopwatch_dac
    # address: 0x18
    use_microphone: True
    # sample_rate: 32000
    # bits_per_sample: 16bit
i2s_audio:
  - id: stopwatch_i2s_audio
    i2s_mclk_pin: GPIO18
    i2s_bclk_pin: GPIO17
    i2s_lrclk_pin: GPIO15
speaker:
  - platform: i2s_audio
    i2s_audio_id: stopwatch_i2s_audio
    audio_dac: stopwatch_dac
    id: stopwatch_speaker
    i2s_dout_pin: GPIO21  # DOUT on the device
    dac_type: external
    channel: mono  # FIXME: Is it more efficient to say 'left'?
microphone:
  - platform: i2s_audio
    i2s_audio_id: stopwatch_i2s_audio
    id: stopwatch_mic
    i2s_din_pin: GPIO16  # DIN on the device
    adc_type: external
