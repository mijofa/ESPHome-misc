# https://docs.m5stack.com/en/core/StopWatch
esphome:
  on_boot:
    then:
      # read the RTC time once when the system boots
      - rx8130.read_time:
          id: stopwatch_time

esp32:
  # ref: https://docs.m5stack.com/en/core/StopWatch#platformio
  #          [env:m5stack-stopwatch]
  #          platform = espressif32 @ 6.12.0
  #          board = esp32s3box
  #          framework = arduino
  #          board_build.partitions = default_16MB.csv
  #          board_upload.flash_size = 16MB
  #          board_upload.maximum_size = 16777216
  #          board_build.arduino.memory_type = qio_opi
  #          monitor_speed = 115200
  #          build_flags =
  #              -DESP32S3
  #              -DBOARD_HAS_PSRAM
  #              -DCORE_DEBUG_LEVEL=5
  #              -DARDUINO_USB_CDC_ON_BOOT=1
  #              -DARDUINO_USB_MODE=1
  #          lib_deps =
  #              M5Unified = https://github.com/m5stack/M5Unified
  #              M5GFX = https://github.com/m5stack/M5GFX
  #              M5PM1 = https://github.com/m5stack/M5PM1
  #              M5IOE1 = https://github.com/m5stack/M5IOE1
  board: esp32s3box
  flash_size: 16MB
  # FIXME: Is this necessary/useful? Why do people keep specifying this?
  # framework:
  #   type: arduino

psram:
  # FIXME: Confirm this
  mode: octal
  speed: 80MHz

binary_sensor:
  # https://docs.m5stack.com/en/core/StopWatch#key
  - id: KEYA
    platform: gpio
    pin:
      number: GPIO2
      inverted: true
    name: Yellow button
  - id: KEYB
    platform: gpio
    pin:
      number: GPIO1
      inverted: true
    name: Blue button

# I²C bus
i2c:
  - id: stopwatch_i2c_bus
    sda: GPIO47
    scl: GPIO48
    scan: True

# IMU & RTC
# ref: https://docs.m5stack.com/en/core/StopWatch#imu--rtc
time:
  - platform: rx8130
    i2c_id: stopwatch_i2c_bus
    id: stopwatch_time
    # address: 0x32
motion:
  - platform: bmi270
    i2c_id: stopwatch_i2c_bus
    id: stopwatch_motion_hub
    # address: 0x68

