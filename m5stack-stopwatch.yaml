m5ioe1:
  id: stopwatch_m5ioe1_hub
  reset: True
  address: 0x4F

# # Vibration motor
# FIXME: WTF can't I make this work?!?
# output:
#   - platform: m5ioe1
#     m5ioe1_id: stopwatch_m5ioe1_hub
#     id: stopwatch_vibration
#     channel: PWM_1  # PYG9 / IO9 / Pin Number 8?!?!
#     pwm_polarity: ACTIVE_HIGH
#     inverted: false
# fan:
#   - platform: speed
#     output: stopwatch_vibration
#     name: "Vibration fan"
#     id: stopwatch_vibration_fan
# switch:
#   - platform: output
#     output: stopwatch_vibration
#     name: "Vibration switch"
#     id: stopwatch_vibration_pwm_switch
switch:
  # Vibration motor
  - platform: gpio
    id: stopwatch_vibration_switch
    # FIXME: I should be able to make this work with PWM/analog outputs, but that's not been working
    name: "Vibration"
    # icon: mdi:vibrate  # FIXME: Any way to make it show 'vibrate-off' when it's off?
    icon: mdi:alert-decagram  # Looks kinda like a vibrating circle
    restore_mode: ALWAYS_OFF
    pin:
      m5ioe1_id: stopwatch_m5ioe1_hub
      number: 8

  # Audio
  - platform: gpio
    # This MUST be on before ES8311 setup below.
    # This is the power supply for the audio DAC & ADC,
    # without this the ES8311 chip won't respond on i2c and setup will fail.
    # AIUI, the upstream firmware leaves it off until the audio player 'app' is started,
    # at which point it powers the ES8311 on, then initialises the driver.
    # ESPHome initialises all drivers on boot.
    # FIXME: Does this need to be a switch?
    id: stopwatch_psu_audio

    # When rebooting, this pin was staying HIGH across the reboot.
    # This resulted in the es8311 never rebooting,
    # which caused it to fail to initialise properly.
    # So let's restore LOW, and turn it back on immediately
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - then:
        - switch.turn_on: stopwatch_psu_audio

    internal: True
    pin:
        m5ioe1_id: stopwatch_m5ioe1_hub
        number: 2  # PYG3
        # mode:
        #     output: true
        #     open_drain: false
  - platform: gpio
    # This just enables the speaker/amplifier.
    # No sound will play with this off, but that's ok
    id: stopwatch_speaker_enable
    pin:
        m5ioe1_id: stopwatch_m5ioe1_hub
        number: 9  # PYG10
    name: "Speaker enable"
    icon: mdi:volume-vibrate  # Not great, but good enough. Couldn't find a sensible 'circular' one
    restore_mode: ALWAYS_ON
    internal: false

  - platform: gpio
    id: stopwatch_psu_display
    restore_mode: ALWAYS_ON
    internal: True
    pin:
        m5ioe1_id: stopwatch_m5ioe1_hub
        number: 7  # PYG8

  - platform: template
    id: stopwatch_m5pm1_pwr_src
    name: "M5PM1 USB/DC input"
    optimistic: True
    lambda: !lambda |-
      // FIXME: Doesn't handle 5VINOUT
      optional<uint8_t> maybe_m5pm1_pwr_src = id(stopwatch_m5pm1).read_byte(0x04);
      uint8_t m5pm1_pwr_src = *std::move(maybe_m5pm1_pwr_src);
      if (m5pm1_pwr_src) {
        return m5pm1_pwr_src & 0x01;
      }
      // FIXME: Raise exception here


# Audio
# ref: https://docs.m5stack.com/en/core/StopWatch#audio
audio_dac:
  - platform: es8311
    i2c_id: stopwatch_i2c_bus
    id: stopwatch_dac
    # address: 0x18
    use_microphone: True
    # sample_rate: 32000
    # bits_per_sample: 16bit
i2s_audio:
  - id: stopwatch_i2s_audio
    i2s_mclk_pin: GPIO18  # I2S_MCLK
    i2s_bclk_pin: GPIO17  # I2S_BCLK
    i2s_lrclk_pin: GPIO15  # I2S_LRCK
speaker:
  - platform: i2s_audio
    i2s_audio_id: stopwatch_i2s_audio
    audio_dac: stopwatch_dac
    id: stopwatch_speaker
    i2s_dout_pin: GPIO21  # I2S_DSDIN  # DOUT on the sticker
    dac_type: external
    channel: mono  # FIXME: Is it more efficient to say 'left'?
microphone:
  - platform: i2s_audio
    i2s_audio_id: stopwatch_i2s_audio
    id: stopwatch_mic
    i2s_din_pin: GPIO16  # I2S_ASDOUT  # DIN on the sticker
    adc_type: external

# AMOLED
# ESP32S3R8 	G39 	    G40 	    G38 	    G41 	    G42 	    G46 	    G45
# CO5300 	    OLED_CS 	OLED_SCK 	OLED_TE 	OLED_D0 	OLED_D1 	OLED_D2 	OLED_D3
# The display reset is controlled via PYG5 (PYB_OLED_RST) of the M5IOE1 expansion chip.
spi:
  - id: stopwatch_qspi_hub
    type: quad
    clk_pin: GPIO40  # PYB_TP_RST
    data_pins:
      - GPIO41  # OLED_D0
      - GPIO42  # OLED_D1
      - number: GPIO46  # OLED_D2
        ignore_strapping_warning: True
      - number: GPIO45  # OLED_D3
        ignore_strapping_warning: True
display:
  - platform: mipi_spi
    id: stopwatch_display
    model: CO5300  # FIXME: ...?
    bus_mode: quad
    # data_rate: 80MHz
    spi_mode: MODE0
    # # dc_pin:
    reset_pin:  # PYB_OLED_RST
        m5ioe1_id: stopwatch_m5ioe1_hub
        number: 4  # PYG5
    cs_pin: GPIO39  # OLED_CS
    dimensions:
        width: 466
        height: 466
        offset_width: 6
        # offset_height: 1
    # color_order: rgb
    # invert_colors: false
    brightness: 50
    color_depth: 16bit
light:
  - platform: mipi_spi
    id: stopwatch_display_brightness
    display_id: stopwatch_display
    name: "Display Brightness"
    # icon: mdi:television-shimmer
    # icon: mdi:monitor-shimmer
    # icon: mdi:shimmer
    # icon: mdi:wall-sconce-round-variant
    # icon: mdi:wall-sconce-round-variant-outline
    icon: mdi:circle-opacity
    # Start at 25% brightness
    initial_state:
      brightness: 25%
      state: ON
    # Remember brightness from previous boot, but always turn it on when booting
    restore_state:
      state: ON
  - platform: binary
    name: "Power LED"
    output: stopwatch_m5pm1_led_en_output

output:
  - platform: template
    id: stopwatch_m5pm1_led_en_output
    type: binary
    write_action:
      - lambda: !lambda |-
          auto m5pm1_pwr_cfg = id(stopwatch_m5pm1).read_byte(0x06);
          uint8_t m5pm1_pwr_cfg_int = std::move(*m5pm1_pwr_cfg);
          if ((!state) && (m5pm1_pwr_cfg_int & (1<<4))) {  // State is off, but LED is on
            ESP_LOGD("m5pm1_mijofa", "Turning off LED");
            id(stopwatch_m5pm1).write_byte(0x06, (m5pm1_pwr_cfg_int & ~(1<<4)));
          } else if ((state) && !(m5pm1_pwr_cfg_int & (1<<4))) {  // State is on, but LED is off
            ESP_LOGD("m5pm1_mijofa", "Turning on LED");
            id(stopwatch_m5pm1).write_byte(0x06, (m5pm1_pwr_cfg_int | (1<<4)));
          };

# Touch
touchscreen:
  platform: cst816
  id: stopwatch_touchscreen
  display: stopwatch_display
  interrupt_pin: GPIO13  # TP_INT
  reset_pin:  # PYB_TP_RST
    m5ioe1_id: stopwatch_m5ioe1_hub
    number: 3  # PYG4
  # Not needed when 'interrupt_pin' is set
  update_interval: never
