substitutions:
  # ref: https://docs.m5stack.com/en/atom/Atomic_Audio-3.5_Base#compatible
  # These are the pins used by the AtomS3-Lite
  # You should redefine them regardless as I may change my mind what I want to use by default
  spk_base_pin_lrclk: GPIO39
  spk_base_pin_data: GPIO38
  spk_base_pin_bclk: GPIO5
  spk_base_pin_spi_mosi: GPIO6
  spk_base_pin_spi_clk: GPIO7
  spk_base_pin_spi_miso: GPIO8

external_components:
  # https://github.com/esphome/esphome/pull/14389
  - id: upstream_pr_snapclient
    source: github://pr#14389
    components: [ snapclient, media_player ]
    refresh: 1d
  # - id: upstream_pr_snapclient
  #   source: github://mijofa/esphome-luar123-snapclient@snapclient2
  #   components: [ snapclient, media_player ]
  #   refresh: 0s

# ============================================================================
# ESP32 Hardware Configuration
# ============================================================================
esp32:
  framework:
    type: esp-idf

### i2c/i2s communication bus
i2s_audio:
  - id: spk_base_i2s_audio
    i2s_lrclk_pin: "${spk_base_pin_lrclk}"
    i2s_bclk_pin: "${spk_base_pin_bclk}"

# Uncomment this section for snapcast instead of sendspin
media_player:
  - platform: snapclient
    # Don't show up in Home Assistant, because Home Assistant can't really do anything with it anyway.
    # FIXME: Is it possible to associate the snapcast player with this device?
    internal: true
    id: snapclient_media_player
    # hostname:  # Uses mDNS by default
    # port: 1704  # default
    # name: ${friendly_name}
    i2s_dout_pin: ${spk_base_pin_data}
    # on_play:
    #   - logger.log: "Playback started!"
    # on_pause:
    #   - logger.log: "Playback paused!"
    # on_idle:
    #   - logger.log: "Playback finished!"
    # on_state:
    #   - logger.log: "Playback State change!"
