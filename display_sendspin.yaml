substitutions:
  # display_lvgl_id: atoms3r_display_lvgl
  # display_player_id: media_player_sendspin

esphome:
  on_boot:
    - lvgl.page.show: page_playback_state

globals:
  - type: double
    id: media_player_sendspin_previous_volume
  # - type: bool
  #   id: media_player_sendspin_state_display_art
  # - type: esphome::media_player::MediaPlayerState
  #   id: media_player_sendspin_previous_state

script:
  - id: display_player_state
    mode: restart
    then:
      - if:
          condition:
            - media_player.is_off: ${display_player_id}
          then:
            - lvgl.image.update:
                id: widget_playback_state
                src: image_state_pending
            - lvgl.widget.hide: lvgl_widget_sendspin_art
            # - lambda: "id(media_player_sendspin_state_display_art) = false;"
          else:
            # FIXME: ESPHome really has no if/elif equivalent?
            - if:
                any:
                  - media_player.is_paused: ${display_player_id}
                then:
                  - lvgl.image.update:
                      id: widget_playback_state
                      src: image_state_paused
                  - lvgl.widget.show: lvgl_widget_sendspin_art
                  # - lambda: "id(media_player_sendspin_state_display_art) = true;"
                  - script.stop: display_player_state  # Stop the script because we can't have 'elif' below
            - if:
                any:
                  - media_player.is_idle: ${display_player_id}
                then:
                  - lvgl.image.update:
                      id: widget_playback_state
                      src: image_state_stopped
                  - lvgl.widget.hide: lvgl_widget_sendspin_art
                  # - lambda: "id(media_player_sendspin_state_display_art) = false;"
                  - script.stop: display_player_state  # Stop the script because we can't have 'elif' below
            - if:
                any:
                  - media_player.is_muted: ${display_player_id}
                then:
                  - lvgl.image.update:
                      id: widget_playback_state
                      src: image_volume_mute
                  - lvgl.widget.show: lvgl_widget_sendspin_art
                  # - lambda: "id(media_player_sendspin_state_display_art) = true;"
                  - script.stop: display_player_state  # Stop the script because we can't have 'elif' below
            - if:
                any:
                  - media_player.is_announcing: ${display_player_id}
                then:
                  - lvgl.image.update:
                      id: widget_playback_state
                      src: image_state_announcing
                  # FIXME: Should be shown?
                  - lvgl.widget.hide: lvgl_widget_sendspin_art
                  # - lambda: "id(media_player_sendspin_state_display_art) = false;"
                  - script.stop: display_player_state  # Stop the script because we can't have 'elif' below
            - if:
                any:
                  - media_player.is_playing: ${display_player_id}
                then:
                  - lvgl.image.update:
                      id: widget_playback_state
                      src: image_state_playing
                  - lvgl.widget.show: lvgl_widget_sendspin_art
                  # - lambda: "id(media_player_sendspin_state_display_art) = true;"
                  - script.stop: display_player_state  # Stop the script because we can't have 'elif' below
            # FIXME: Other?
  - id: display_player_temp_state
    # I only really have this as a script to get the delayed removal.
    # By using mode:restart, the timeout will reset whenever the script is rerun
    mode: restart
    # FIXME: Make this take an argument and update the widget accordingly
    then:
      - lvgl.page.show: page_temp_state
      - delay: 2s
      - lvgl.page.show: page_playback_state
  # - id: display_maybe_hide_sendspin_art
  #   mode: restart
  #   then:
  #     # FIXME This needs to only run when the state **changes** from a hidden to shown state.
  #     #       Otherwise the transition will just repeat even if the widget is already shown
  #     - if:
  #         condition:
  #           - lambda: |-  # State has actually changed
  #               return id(media_player_sendspin_state_display_art);
  #         then:
  #           - lvgl.animation.start: sendspin_art_show
  #         else:
  #           - lvgl.animation.start: sendspin_art_hide

media_player:
  - id: !extend ${display_player_id}
    on_state:
      then:
        - script.execute: display_player_state
        # - if:
        #     condition:
        #       - lambda: |-  # State has actually changed
        #           return id(media_player_sendspin_previous_state) != id(media_player_sendspin).state;
        #     then:
        #       - lambda: |-  # FIXME: Can logger.log be used for this properly?
        #           ESP_LOGD("media_player",
        #                    "Confirmed media player state changed: %s -> %s",
        #                    media_player_state_to_string(id(media_player_sendspin_previous_state)),
        #                    media_player_state_to_string(id(media_player_sendspin).state));
        #     # FIXME: Run script to (maybe) update displayed state
        # - lambda: |-  # Record new state se we can detect the next change properly
        #     id(media_player_sendspin_previous_state) = id(media_player_sendspin).state;
    on_mute:
      then:
        - script.execute: display_player_state
    on_unmute:
      then:
        - lvgl.image.update:
            id: widget_temp_state
            src: image_volume_unmute
        - script.execute: display_player_temp_state
    on_volume:
      then:
        # FIXME: Show vol+/- icon for a few seconds
        - if:
            condition:
              - lambda: |-  # Volume down
                  return id(media_player_sendspin_previous_volume) > id(media_player_sendspin).volume;
            then:
              - lvgl.image.update:
                  id: widget_temp_state
                  src: image_volume_down
            else:  # Assume volume up
              - lvgl.image.update:
                  id: widget_temp_state
                  src: image_volume_up
        - lambda: |-
            id(media_player_sendspin_previous_volume) = id(media_player_sendspin).volume;
        - script.execute: display_player_temp_state
    # on_idle:
    #   then:
    # on_pause:
    #   then:
    # on_turn_off:
    #   then:
    # on_play:
    #   then:
    # on_announcement:
    #   then:
    # on_turn_on:
    #   then:

image:
  - platform: sendspin
    id: image_sendspin_art
    format: JPEG
    type: RGB565
    resize: 128x128
    source: ALBUM
    current_image:
      id: image_sendspin_art_current
    transition_image:
      id: image_sendspin_art_transition
    # on_image_display:
    #   - logger.log:
    #       format: "Album art displayed (late by %u ms)"
    #       args: ["(unsigned) lateness_ms"]
    #   # Stand in for a display transition. With a transition image, every display must end
    #   # with transition_finished so the next frame is released.
    #   - delay: 300ms
    #   - sendspin.image.transition_finished: sendspin_album_art
    # on_image_clear:
    #   - logger.log: "Album art cleared"
    # on_image_error:
    #   - logger.log: "Album art error"

    # Start the fade 1s before the track boundary so the 2s cross-fade straddles it.
    display_offset: 1s
    on_image_display:
      # A widget keeps drawing the buffer it was last pointed at until its source is set again, so
      # both widgets are re-pointed on every display: the top widget at the outgoing frame
      # (covering the bottom), the bottom widget at the new frame. The transition image is black
      # before the first artwork, so the first fade needs no special case.
      - lvgl.image.update:
          id: outgoing_art
          src: image_sendspin_art_transition
      - lvgl.image.update:
          id: incoming_art
          src: image_sendspin_art_current
      - lvgl.animation.start: sendspin_art_crossfade
  # FIXME: I want type:grayscale (or even binary) but that keeps coming up as black instead of white with faulty transparency
  - platform: file
    resize: 96x96
    type: RGB565
    transparency: alpha_channel
    id: image_state_pending
    file: "https://github.com/mijofa/ESPHome-misc/raw/11bda73c9b1ca1a28bb39faab31355611749b9cd/icons/pending_96dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg"
  - platform: file
    resize: 96x96
    type: RGB565
    transparency: alpha_channel
    id: image_state_playing
    file: "https://github.com/mijofa/ESPHome-misc/raw/11bda73c9b1ca1a28bb39faab31355611749b9cd/icons/play_circle_96dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg"
  - platform: file
    resize: 96x96
    type: RGB565
    transparency: alpha_channel
    id: image_state_paused
    file: "https://github.com/mijofa/ESPHome-misc/raw/11bda73c9b1ca1a28bb39faab31355611749b9cd/icons/pause_circle_96dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg"
  - platform: file
    resize: 96x96
    type: RGB565
    transparency: alpha_channel
    id: image_state_stopped
    file: "https://github.com/mijofa/ESPHome-misc/raw/11bda73c9b1ca1a28bb39faab31355611749b9cd/icons/stop_circle_96dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg"
  - platform: file
    resize: 96x96
    type: RGB565
    transparency: alpha_channel
    id: image_state_announcing
    file: "https://github.com/mijofa/ESPHome-misc/raw/11bda73c9b1ca1a28bb39faab31355611749b9cd/icons/campaign_96dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg"
  - platform: file
    resize: 96x96
    type: RGB565
    transparency: alpha_channel
    id: image_volume_up
    file: "https://github.com/mijofa/ESPHome-misc/raw/11bda73c9b1ca1a28bb39faab31355611749b9cd/icons/volume_up_96dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg"
  - platform: file
    resize: 96x96
    type: RGB565
    transparency: alpha_channel
    id: image_volume_mute
    file: "https://github.com/mijofa/ESPHome-misc/raw/11bda73c9b1ca1a28bb39faab31355611749b9cd/icons/volume_off_96dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg"
  - platform: file
    resize: 96x96
    type: RGB565
    transparency: alpha_channel
    id: image_volume_unmute
    file: "https://github.com/mijofa/ESPHome-misc/raw/11bda73c9b1ca1a28bb39faab31355611749b9cd/icons/volume_mute_96dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg"
  - platform: file
    resize: 96x96
    type: RGB565
    transparency: alpha_channel
    id: image_volume_down
    file: "https://github.com/mijofa/ESPHome-misc/raw/11bda73c9b1ca1a28bb39faab31355611749b9cd/icons/volume_down_96dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.svg"

lvgl:
  - id: !extend ${display_lvgl_id}
    animations:
      # Fades the top widget out to reveal the new artwork underneath. Starting it also snaps the
      # widget back to full opacity, and on_stop acks the transition so the library can deliver the
      # next artwork.
      - id: sendspin_art_crossfade
        duration: 2s
        widgets:
          - id: outgoing_art
            opa:
              from: 100%
              to: 0%
        on_stop:
          - sendspin.image.transition_finished: image_sendspin_art
      # # Fades the whole sendspin container out
      # - id: sendspin_art_hide
      #   duration: 1s
      #   widgets:
      #     - id: lvgl_widget_sendspin_art
      #       opa:
      #         from: 100%
      #         to: 0%
      # # Fades the whole sendspin container in
      # - id: sendspin_art_show
      #   duration: 1s
      #   widgets:
      #     - id: lvgl_widget_sendspin_art
      #       opa:
      #         from: 0%
      #         to: 100%
    bottom_layer:
      bg_color: BLACK
      bg_opa: COVER
      widgets:
        - container:
            id: lvgl_widget_sendspin_art
            # # Hide by default, don't become visible until playback state says to
            # hidden: true
            # opa: 0%
            widgets:
              # Cross-fade pair: the bottom widget always shows the current artwork; the top widget is
              # pointed at the outgoing frame on each display event and faded out over it.
              - image:
                  id: incoming_art
                  src: image_sendspin_art_current
              - image:
                  id: outgoing_art
                  src: image_sendspin_art_current

    pages:
      - id: page_playback_state
        bg_opa: TRANSP
        widgets:
          - image:
              id: widget_playback_state
              align: CENTER
              # # LVGL doesn't support a giving the text an outline, sadly.
              # # I tried abusing both shadow & drop_shadow into something, but it wasn't viable
              # # this blend mode has a somewhat useful effect of effectively inverting the underlaying colour
              # blend_mode: DIFFERENCE
              src: image_state_pending
      - id: page_temp_state
        bg_opa: TRANSP
        skip: true
        widgets:
          - image:
              id: widget_temp_state
              align: CENTER
              # # LVGL doesn't support a giving the text an outline, sadly.
              # # I tried abusing both shadow & drop_shadow into something, but it wasn't viable
              # # this blend mode has a somewhat useful effect of effectively inverting the underlaying colour
              # blend_mode: DIFFERENCE
              src: image_state_pending  # Should never appear as it should be updated before we ever show this page
