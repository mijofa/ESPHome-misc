      # - "\U0000e8c8"  # settings_voice
      # - "\U0000e39f"  # assistant

image:
  - platform: sendspin
    id: image_sendspin_art
    format: JPEG
    type: RGB565
    resize: 128x128
    source: ALBUM
    current_image:
      id: image_sendspin_art_current
    transition_image:
      id: image_sendspin_art_transition
    # on_image_display:
    #   - logger.log:
    #       format: "Album art displayed (late by %u ms)"
    #       args: ["(unsigned) lateness_ms"]
    #   # Stand in for a display transition. With a transition image, every display must end
    #   # with transition_finished so the next frame is released.
    #   - delay: 300ms
    #   - sendspin.image.transition_finished: sendspin_album_art
    # on_image_clear:
    #   - logger.log: "Album art cleared"
    # on_image_error:
    #   - logger.log: "Album art error"

    # Start the fade 1s before the track boundary so the 2s cross-fade straddles it.
    display_offset: 1s
    on_image_display:
      # A widget keeps drawing the buffer it was last pointed at until its source is set again, so
      # both widgets are re-pointed on every display: the top widget at the outgoing frame
      # (covering the bottom), the bottom widget at the new frame. The transition image is black
      # before the first artwork, so the first fade needs no special case.
      - lvgl.image.update:
          id: outgoing_art
          src: image_sendspin_art_transition
      - lvgl.image.update:
          id: incoming_art
          src: image_sendspin_art_current
      - lvgl.animation.start: sendspin_art_crossfade

lvgl:
  - id: !extend ${display_lvgl_id}
    animations:
      # Fades the top widget out to reveal the new artwork underneath. Starting it also snaps the
      # widget back to full opacity, and on_stop acks the transition so the library can deliver the
      # next artwork.
      - id: sendspin_art_crossfade
        duration: 2s
        widgets:
          - id: outgoing_art
            opa:
              from: 100%
              to: 0%
        on_stop:
          - sendspin.image.transition_finished: image_sendspin_art
      # Fades the whole sendspin container out
      - id: sendspin_art_hide
        duration: 1s
        widgets:
          - id: lvgl_widget_sendspin_art
            opa:
              from: 100%
              to: 0%
      # Fades the whole sendspin container in
      - id: sendspin_art_show
        duration: 1s
        widgets:
          - id: lvgl_widget_sendspin_art
            opa:
              from: 0%
              to: 100%
    bottom_layer:
      bg_color: BLACK
      bg_opa: COVER
      widgets:
        - container:
            id: lvgl_widget_sendspin_art
            # Hide by default, don't become visible until the show animation plays
            opa: 0%
            widgets:
              # Cross-fade pair: the bottom widget always shows the current artwork; the top widget is
              # pointed at the outgoing frame on each display event and faded out over it.
              - image:
                  id: incoming_art
                  src: image_sendspin_art_current
              - image:
                  id: outgoing_art
                  src: image_sendspin_art_current

    pages:
      - id: page_playback_state
        bg_opa: TRANSP
        widgets:
          - label:
              # ref: https://esphome.io/cookbook/lvgl/#battery-status-icon
              id: lbl_playback_state
              align: CENTER
              text_font: material_symbols
              # LVGL doesn't support a giving the text an outline, sadly.
              # I tried abusing both shadow & drop_shadow into something, but it wasn't viable
              # this blend mode has a somewhat useful effect of effectively inverting the underlaying colour
              blend_mode: DIFFERENCE
              text_color: white
              text: "\U0000ef64"  # pending
  
      - id: page_temp_state
        bg_opa: TRANSP
        skip: true
        widgets:
          - label:
              id: lbl_temp_state
              align: CENTER
              text_font: material_symbols
              blend_mode: DIFFERENCE
              text_color: white
              text: "\U0000ef64"
